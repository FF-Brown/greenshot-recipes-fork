name: Publish the index

# Every merge that changes a recipe publishes index.json as a release: the website and Greenshot read the latest one.
# index.json.sig is its ECDSA P-256 signature (SHA-256, DER), checked by Greenshot before it installs from the catalog.
on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'tools/**'
      - 'catalog.schema.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GREENSHOT_REF: ${{ vars.GREENSHOT_REF || 'main' }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: python -m pip install jsonschema==4.23.0

      - name: Check
        run: |
          # by commit: raw.githubusercontent.com caches a branch name for minutes
          sha=$(git ls-remote https://github.com/greenshot/greenshot "$GREENSHOT_REF" | head -n 1 | cut -f 1)
          sha=${sha:-$GREENSHOT_REF}
          curl -fsSL -o "$RUNNER_TEMP/recipe.schema.json" "https://raw.githubusercontent.com/greenshot/greenshot/$sha/docs/vNext/recipe.schema.json"
          python tools/catalog.py check --schema "$RUNNER_TEMP/recipe.schema.json"

      - name: Build index.json
        run: python tools/catalog.py index --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/index.json"

      - name: Sign index.json
        # RECIPE_INDEX_SIGNING_KEY: the private key (PEM) of one of the public keys built into Greenshot
        env:
          SIGNING_KEY: ${{ secrets.RECIPE_INDEX_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::RECIPE_INDEX_SIGNING_KEY isn't set, this release has no signature and Greenshot won't install from it"
            exit 0
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/index.json.sig" "$RUNNER_TEMP/index.json"
          openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -out "$RUNNER_TEMP/key.pub.pem"
          rm -f "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/key.pub.pem" -signature "$RUNNER_TEMP/index.json.sig" "$RUNNER_TEMP/index.json"
          echo "Signed with:"
          cat "$RUNNER_TEMP/key.pub.pem"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="catalog-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          files=("$RUNNER_TEMP/index.json")
          if [ -f "$RUNNER_TEMP/index.json.sig" ]; then
            files+=("$RUNNER_TEMP/index.json.sig")
          fi
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --latest \
            --title "Catalog $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes "index.json of commit $GITHUB_SHA"

      - name: Tell the website
        # Starts "Recipe pages" in greenshot/greenshot, which rebuilds getgreenshot.org/recipes; WEBSITE_DISPATCH_TOKEN: fine-grained token for greenshot/greenshot with Contents read and write
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::WEBSITE_DISPATCH_TOKEN isn't set, run \"Recipe pages\" in greenshot/greenshot by hand to show this index on the website"
            exit 0
          fi
          gh api repos/greenshot/greenshot/dispatches -f event_type=recipes-published
